# Test profile — Redis host/port injected by Testcontainers via @DynamicPropertySource
spring.jackson2.serialization.write-dates-as-timestamps=false
spring.jackson2.deserialization.fail-on-unknown-properties=true
spring.jackson2.default-property-inclusion=non_null
logging.level.io.runcycles.protocol=INFO

# Prevent expiry sweep from firing before TestContainers Redis is ready
cycles.expiry.initial-delay-ms=999999999

# Disable tenant config cache in tests so each test gets fresh config from Redis
cycles.tenant-config.cache-ttl-ms=0

# Keep the HTTP protocol on the configured Jackson 2 mapper.
spring.http.converters.preferred-json-mapper=jackson2
